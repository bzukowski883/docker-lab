events{}

http {
    server {
        listen 80;

        # Serve static files from /usr/share/nginx/html
        root /usr/share/nginx/html;

        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /api/ {
            proxy_pass http://backend:8000/;
        }
    }
}
